name: Deploy Frontend to HSY

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GITEE_URL: "git@gitee.com:barondd/upc-frontend.git"
  FRONTEND_DIR: "/opt/projects/upc-frontend"
  BACKEND_DIR: "/opt/projects/upc" # HSY 的 docker-compose 文件所在目录

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 同步前端代码到 Gitee
      - name: Sync to Gitee
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H gitee.com >> ~/.ssh/known_hosts
          git remote add gitee ${{ env.GITEE_URL }}
          git push gitee HEAD:main -f

      # 2. 在 HSY 上拉取并构建镜像SS
      - name: Execute HSY Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HSY_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            # 环境准备：下发临时私钥用于拉取源码
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa_deploy
            chmod 600 ~/.ssh/id_rsa_deploy

            # 更新/初始化前端代码
            mkdir -p ${{ env.FRONTEND_DIR }}
            cd ${{ env.FRONTEND_DIR }}
            
            if [ ! -d ".git" ]; then
              git init
              git remote add origin ${{ env.GITEE_URL }}
            fi

            git remote set-url origin ${{ env.GITEE_URL }}
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_rsa_deploy -o StrictHostKeyChecking=no" git fetch origin main
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_rsa_deploy -o StrictHostKeyChecking=no" git reset --hard FETCH_HEAD

            # 构建前端镜像
            echo "Building Frontend image on HSY..."
            docker build -t upc-frontend:latest .

            # 使用 HSY 的 docker-compose 重启前端服务
            echo "Updating service via Docker Compose..."
            cd ${{ env.BACKEND_DIR }}
            # --no-deps 确保只更新前端，不影响已运行的网关和AI
            docker compose -f docker-compose-hsy.yml up -d --no-deps --force-recreate upc-frontend

            # 清理
            rm -f ~/.ssh/id_rsa_deploy
            docker image prune -f
            echo "Frontend Deployment Done!"