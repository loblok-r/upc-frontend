name: Deploy Frontend (Sync & Docker)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  SERVER_IP: ${{ secrets.SERVER_IP }}
  SERVER_USER: root

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 同步代码到 Gitee (保持你的配置)
      - name: Sync to Gitee (SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H gitee.com >> ~/.ssh/known_hosts
          # 修改为前端 Gitee 仓库地址
          git remote add gitee git@gitee.com:barondd/upc-frontend.git
          echo "Pushing to Gitee..."
          git push gitee HEAD:main -f

      - name: Execute Server Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            # 开启调试模式，打印执行的每一行命令，方便排错
            set -x
            set -e
            
            # === 配置变量 ===
            PROJECT_PATH="/opt/projects/upc-frontend"
            GIT_REPO="https://gitee.com/barondd/upc-frontend.git"
            CONTAINER_NAME="upc-frontend"
            IMAGE_NAME="upc-frontend:latest"
            
            echo "🚀 Starting deployment..."
            
            # === 1. 暴力清理旧代码 (确保环境干净) ===
            # 如果目录存在，直接删掉。不要纠结它是 Git 仓库还是空文件夹
            if [ -d "$PROJECT_PATH" ]; then
              echo "🗑️  Removing existing directory to ensure clean slate..."
              rm -rf "$PROJECT_PATH"
            fi
            
            # === 2. 重新拉取代码 ===
            echo "⬇️  Cloning repository..."
            git clone "$GIT_REPO" "$PROJECT_PATH"
            
            # 进入目录
            cd "$PROJECT_PATH"
            
            # 确认当前提交 (可选调试信息)
            echo "🔍  Current commit:"
            git rev-parse --short HEAD
            
            # === 3. 构建 Docker 镜像 ===
            echo "🐳  Building Docker image..."
            # 确保 Dockerfile 已经升级到了 node:22-alpine (根据上一步的修复)
            docker build -t "$IMAGE_NAME" .
            
            # === 4. 停止并删除旧容器 ===
            if [ "$(docker ps -aq -f name=$CONTAINER_NAME)" ]; then
                echo "YZ  Stopping old container..."
                docker stop $CONTAINER_NAME
                docker rm $CONTAINER_NAME
            fi
            
            # === 5. 启动新容器 ===
            echo "🚀  Starting container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart always \
              -p 80:80 \
              "$IMAGE_NAME"
            
            # === 6. 清理垃圾 ===
            echo "🧹  Pruning unused images..."
            docker image prune -f
            
            echo "✅  Deployment Successfully Completed!"