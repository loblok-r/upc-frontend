name: Deploy Frontend (Sync & Docker)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  SERVER_IP: ${{ secrets.SERVER_IP }}
  SERVER_USER: root

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 同步代码到 Gitee
      - name: Sync to Gitee (SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H gitee.com >> ~/.ssh/known_hosts
          # 修改为前端 Gitee 仓库地址
          git remote add gitee git@gitee.com:barondd/upc-frontend.git
          echo "Pushing to Gitee..."
          git push gitee HEAD:main -f

      - name: Execute Server Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -x
            set -e
            
            # === 配置变量 ===
            PROJECT_PATH="/opt/projects/upc-frontend"
            COMPOSE_PATH="/opt/projects/upc-backend" # 指向 Compose 文件所在目录
            GIT_REPO="https://gitee.com/barondd/upc-frontend.git"
            IMAGE_NAME="upc-frontend:latest"
            
            echo "Starting Frontend deployment..."
            
            # === 更新代码 ===
            if [ -d "$PROJECT_PATH" ]; then
              rm -rf "$PROJECT_PATH"
            fi
            git clone "$GIT_REPO" "$PROJECT_PATH"
            cd "$PROJECT_PATH"
            
            # === 构建 Docker 镜像 ===
            echo "Building Frontend image..."
            # 这里的构建会自动读取你项目里的 Dockerfile 和 nginx.conf
            docker build -t "$IMAGE_NAME" .
            
            # === 交给 Compose 统一调度 ===
            # 不再手动 docker stop/run，因为那样前端会脱离 upc-net 网络
            
            echo "⚓ Moving to Compose directory..."
            cd "$COMPOSE_PATH"
            
            echo "Updating Frontend service via Compose..."
            # --no-deps: 不重启 mysql/redis/backend
            # --force-recreate: 强制根据最新构建的镜像重建容器
            docker compose up -d --no-deps --force-recreate frontend
            
            # === 清理旧镜像 ===
            echo "Pruning unused images..."
            docker image prune -f
            
            echo "Frontend Deployment Successfully Completed!"