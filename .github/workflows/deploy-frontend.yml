name: Deploy Frontend (Sync & Docker)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  SERVER_IP: ${{ secrets.SERVER_IP }}
  SERVER_USER: root

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 同步代码到 Gitee (保持你的配置)
      - name: Sync to Gitee (SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H gitee.com >> ~/.ssh/known_hosts
          # 修改为前端 Gitee 仓库地址
          git remote add gitee git@gitee.com:barondd/upc-frontend.git
          echo "Pushing to Gitee..."
          git push gitee HEAD:main -f

      - name: Execute Server Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -e
            
            # 定义变量
            PROJECT_DIR="/opt/projects/upc-frontend"
            GITEE_URL="https://gitee.com/barondd/upc-frontend.git"
            
            echo "Starting deployment..."
            
            # 1. 智能检查目录状态
            if [ -d "$PROJECT_DIR" ]; then
              cd "$PROJECT_DIR"
              # 尝试执行 git 命令检查是否为有效仓库
              if ! git rev-parse --is-inside-work-tree > /dev/null 2>&1; then
                echo " Folder exists but is NOT a git repo. Deleting..."
                cd ..
                rm -rf "$PROJECT_DIR"
              else
                echo " Valid git repo found."
              fi
            fi
            
            # 2. 如果目录不存在（或是刚被删除），则重新克隆
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Cloning fresh repository..."
              git clone "$GITEE_URL" "$PROJECT_DIR"
              cd "$PROJECT_DIR"
            else
              # 3. 如果目录存在，则拉取更新
              cd "$PROJECT_DIR"
              echo "Fetching latest changes..."
              
              # 强制更新远程地址，防止 url 变更
              git remote set-url origin "$GITEE_URL"
              
              # 丢弃本地修改并拉取
              git fetch origin
              git reset --hard origin/main
              git clean -fd
            fi
            
            # 4. 再次确认 commit hash (用于调试)
            COMMIT_SHA="${{ github.sha }}"
            echo "🔍  Deploying commit: $COMMIT_SHA"
            
            # 5. 构建 Docker 镜像
            echo "Building Frontend Docker image..."
            # 注意：前端构建通常不需要 mvn，而是利用 Dockerfile 里的多阶段构建
            docker build -t upc-frontend:latest .
            
            # 6. 重新启动容器
            echo "Restarting container..."
            if [ "$(docker ps -aq -f name=upc-frontend)" ]; then
                docker rm -f upc-frontend
            fi
            
            docker run -d \
              --name upc-frontend \
              --restart always \
              -p 80:80 \
              upc-frontend:latest
            
            # 7. 清理垃圾镜像
            echo "Cleaning up..."
            docker image prune -f
            
            echo "Deployment success!"