server {
    listen 80;
    server_name localhost;

    # 1. 前端静态资源配置
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # 解决 React Router 在刷新时报 404 的问题
        try_files $uri $uri/ /index.html;
    }

    # 2. 后端 API 反向代理配置
    location /api/ {
        # proxy_pass 指向宿主机的后端服务
        # 注意：在 Docker 中访问宿主机端口，不能用 localhost
        # 如果后端也在 Docker 网络中，可以使用容器名，这里假设后端映射到了宿主机 8069
        # 'host.docker.internal' 在某些 Linux Docker 版本不生效，建议直接填服务器内网IP，或者使用公网IP
        proxy_pass http://10.0.0.4:8069/api/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}